<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TechRadar — Redirecting</title>
    <script>
      // This script handles GitHub Pages SPA routing.
      // When someone navigates directly to a route like /EmergingTechTrack/tech/agentic-ai,
      // GitHub Pages returns a 404. This page catches that 404 and redirects to the
      // index.html with the original path encoded in a query parameter.
      // The index.html then restores the correct route.
      var pathSegmentsToKeep = 1; // keep "/EmergingTechTrack" in the path
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
